<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inscription - BMJ SERVICE</title>


    <style>

        /* ==================================================
                RESET
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==================================================
                BODY
        ================================================== */

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f6f9;

        }


        /* ==================================================
                CONTAINER
        ================================================== */

        .container {

            width: 100%;

            max-width: 430px;

        }


        /* ==================================================
                CARD
        ================================================== */

        .card {

            background: #ffffff;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.10);

        }


        /* ==================================================
                LOGO
        ================================================== */

        .logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .logo h1 {

            font-size: 30px;

            color: #145a86;

            margin-bottom: 8px;

        }


        .logo h1 span {

            color: #d6a72c;

        }


        .logo p {

            color: #777;

            font-size: 14px;

        }


        /* ==================================================
                FORM
        ================================================== */

        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 14px;

            font-weight: 600;

        }


        .form-group input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d9dfe5;

            border-radius: 9px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;

        }


        .form-group input:focus {

            border-color: #145a86;

            box-shadow:
                0 0 0 3px
                rgba(20, 90, 134, 0.08);

        }


        /* ==================================================
                BOUTON
        ================================================== */

        #btnInscription {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 9px;

            background: #145a86;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        #btnInscription:hover {

            background: #0d4568;

        }


        #btnInscription:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* ==================================================
                MESSAGE
        ================================================== */

        #message {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            font-weight: 600;

            min-height: 20px;

        }


        .success {

            color: #16803c;

        }


        .error {

            color: #d62828;

        }


        /* ==================================================
                RESPONSIVE
        ================================================== */

        @media (max-width: 480px) {

            .card {

                padding: 25px 20px;

            }


            .logo h1 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
            CONTAINER
    ================================================== -->

    <div class="container">


        <!-- ==================================================
                CARD
        ================================================== -->

        <div class="card">


            <!-- ==================================================
                    LOGO
            ================================================== -->

            <div class="logo">

                <h1>
                    BMJ <span>SERVICE</span>
                </h1>

                <p>
                    Créez votre compte
                </p>

            </div>


            <!-- ==================================================
                    FORMULAIRE
            ================================================== -->

            <form id="inscriptionForm">


                <!-- NOM -->

                <div class="form-group">

                    <label for="nom">
                        Nom
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Votre nom"
                        autocomplete="family-name"
                        required
                    >

                </div>


                <!-- PRENOM -->

                <div class="form-group">

                    <label for="prenom">
                        Prénom
                    </label>

                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        placeholder="Votre prénom"
                        autocomplete="given-name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- MOT DE PASSE -->

                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 6 caractères"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRMATION -->

                <div class="form-group">

                    <label for="confirmation">
                        Confirmer le mot de passe
                    </label>

                    <input
                        type="password"
                        id="confirmation"
                        name="confirmation"
                        placeholder="Confirmez votre mot de passe"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- BOUTON -->

                <button
                    type="submit"
                    id="btnInscription"
                >

                    Créer mon compte

                </button>


            </form>


            <!-- ==================================================
                    MESSAGE
            ================================================== -->

            <div id="message"></div>


        </div>

    </div>



<script>

/* =========================================================
        BMJ SERVICE
        FRONTEND INSCRIPTION
========================================================= */


/* =========================================================
        URL DE NOTRE API PHP
=========================================================

        IMPORTANT :

        Remplace cette adresse par le véritable
        domaine de ton API InfinityFree.

========================================================= */

const API_URL =
    "https://databese.ct.ws/index.php";


/* =========================================================
        ELEMENTS HTML
========================================================= */

const formulaire =
    document.getElementById(
        "inscriptionForm"
    );


const message =
    document.getElementById(
        "message"
    );


const bouton =
    document.getElementById(
        "btnInscription"
    );


/* =========================================================
        INSCRIPTION
========================================================= */

formulaire.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* ==================================================
                RECUPERATION
        ================================================== */

        const nom =
            document
            .getElementById("nom")
            .value
            .trim();


        const prenom =
            document
            .getElementById("prenom")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmation =
            document
            .getElementById("confirmation")
            .value;


        /* ==================================================
                RESET MESSAGE
        ================================================== */

        message.textContent = "";

        message.className = "";


        /* ==================================================
                VERIFICATION MOT DE PASSE
        ================================================== */

        if (password !== confirmation) {

            message.textContent =
                "Les mots de passe ne correspondent pas.";

            message.className =
                "error";

            return;

        }


        /* ==================================================
                DESACTIVER BOUTON
        ================================================== */

        bouton.disabled = true;

        bouton.textContent =
            "Création du compte...";


        try {


            /* ==================================================
                    REQUETE API
            ================================================== */

            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                nom: nom,

                                prenom: prenom,

                                email: email,

                                password: password

                            })

                    }
                );


            /* ==================================================
                    REPONSE
            ================================================== */

            const data =
                await response.json();


            console.log(
                "Réponse API :",
                data
            );


            /* ==================================================
                    SUCCES
            ================================================== */

            if (
                response.ok &&
                data.success
            ) {

                message.textContent =
                    data.message;

                message.className =
                    "success";


                formulaire.reset();


                console.log(
                    "Utilisateur créé :",
                    data.user
                );


            }


            /* ==================================================
                    ERREUR
            ================================================== */

            else {

                message.textContent =
                    data.message ||
                    "Une erreur est survenue.";

                message.className =
                    "error";

            }


        }


        /* ==================================================
                ERREUR RESEAU / CORS
        ================================================== */

        catch (error) {

            console.error(
                "Erreur API :",
                error
            );


            message.textContent =
                "Impossible de contacter le serveur.";


            message.className =
                "error";

        }


        /* ==================================================
                REACTIVER BOUTON
        ================================================== */

        finally {

            bouton.disabled = false;

            bouton.textContent =
                "Créer mon compte";

        }

    }
);

</script>


</body>

</html>
